name: Alchemy CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff black mypy
      - run: ruff check alchemy/
      - run: black --check alchemy/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install arch pandas numpy scipy
          pip install git+https://github.com/QuantInsti/pyfolio.git || true
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          ALCHEMY_ENV: development
          IB_PAPER_TRADING: "true"
          KITE_PAPER_TRADING: "true"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit safety
      - run: bandit -r alchemy/ -ll
      - run: safety check -r requirements.txt || true
