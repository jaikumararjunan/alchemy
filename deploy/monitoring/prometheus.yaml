apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: alchemy
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: alchemy-app
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [alchemy]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node

  alerts.yml: |
    groups:
    - name: alchemy-alerts
      rules:
      - alert: AlchemyDown
        expr: up{job="alchemy-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alchemy app is down"
          description: "Alchemy trading platform has been down for 1 minute"

      - alert: HighCPU
        expr: rate(container_cpu_usage_seconds_total{namespace="alchemy"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "Alchemy pod CPU > 80% for 5 minutes"

      - alert: HighMemory
        expr: container_memory_usage_bytes{namespace="alchemy"} / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Alchemy pod memory > 85%"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5..",job="alchemy-app"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate"

      - alert: SlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="alchemy-app"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency > 2s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: alchemy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.49.0
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.retention.time=15d
          - --web.enable-lifecycle
        ports: [{containerPort: 9090}]
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits:   {cpu: 500m, memory: 1Gi}
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: alchemy
spec:
  selector:
    app: prometheus
  ports: [{port: 9090, targetPort: 9090}]
