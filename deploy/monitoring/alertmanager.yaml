apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: alchemy
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, severity]
      group_wait:      10s
      group_interval:  5m
      repeat_interval: 4h
      receiver: telegram
      routes:
      - match:
          severity: critical
        receiver: telegram
        repeat_interval: 1h
    receivers:
    - name: telegram
      telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id:   ${TELEGRAM_CHAT_ID}
        message:   |
          🚨 *{{ .Status | toUpper }}* — {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: alchemy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
        ports: [{containerPort: 9093}]
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: alchemy
spec:
  selector:
    app: alertmanager
  ports: [{port: 9093, targetPort: 9093}]
