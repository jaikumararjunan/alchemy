apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: alchemy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.3.0
        ports: [{containerPort: 3000}]
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alchemy-secrets
              key: ADMIN_PASSWORD
        - name: GF_SERVER_ROOT_URL
          value: "https://alchemy.yourdomain.com/grafana"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: alchemy
spec:
  selector:
    app: grafana
  ports: [{port: 3000, targetPort: 3000}]
