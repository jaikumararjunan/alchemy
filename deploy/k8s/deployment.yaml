apiVersion: apps/v1
kind: Deployment
metadata:
  name: alchemy-app
  namespace: alchemy
  labels:
    app: alchemy-app
    version: "0.6"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alchemy-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: alchemy-app
        version: "0.6"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
      - name: alchemy
        image: ghcr.io/jaikumararjunan/alchemy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENV
          value: production
        - name: DATABASE_URL
          value: sqlite+aiosqlite:////data/alchemy.db
        - name: ADMIN_EMAIL
          value: admin@alchemy.in
        envFrom:
        - secretRef:
            name: alchemy-secrets
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu:    "250m"
            memory: "512Mi"
          limits:
            cpu:    "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds:       20
          failureThreshold:    3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds:       10
          failureThreshold:    3
        startupProbe:
          httpGet:
            path: /api/health
            port: 8000
          failureThreshold: 12
          periodSeconds:    10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: alchemy-data
      terminationGracePeriodSeconds: 30
