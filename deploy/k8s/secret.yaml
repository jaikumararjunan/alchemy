# kubectl create secret generic alchemy-secrets --from-env-file=.env.production -n alchemy
# OR apply this template after base64-encoding your values:
# echo -n "yourvalue" | base64
apiVersion: v1
kind: Secret
metadata:
  name: alchemy-secrets
  namespace: alchemy
type: Opaque
stringData:
  JWT_SECRET_KEY:      "CHANGE_ME_32_CHARS_MIN_PRODUCTION"
  ALCHEMY_VAULT_KEY:   "CHANGE_ME_32_CHARS_MIN_PRODUCTION!!"
  ADMIN_PASSWORD:      "CHANGE_ME_STRONG_PASSWORD"
  SMTP_USER:           "your@gmail.com"
  SMTP_PASSWORD:       "your_app_password"
