# Alchemy Trading Platform - Local Docker Compose
# No version field (obsolete in Docker Compose v2+)
#
# Quick start:
#   docker compose -f docker-compose.local.yml up --build
#
# Open: http://localhost:8000
# Login: admin@alchemy.in / Alchemy#Admin!2024

networks:
  alchemy-local:
    driver: bridge

volumes:
  alchemy-data:

services:

  # All-in-one: API + React frontend (SQLite, no external DB needed)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: alchemy:local
    container_name: alchemy-api
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/alchemy.db
      # Redis disabled for local dev - uses in-memory fallback
      REDIS_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - alchemy-data:/app/data
      - ./alchemy:/app/alchemy:ro
    networks:
      - alchemy-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 5

  # Optional: React hot-reload dev server
  # Start with: docker compose -f docker-compose.local.yml --profile dev up
  frontend-dev:
    image: node:20-alpine
    container_name: alchemy-frontend-dev
    working_dir: /app
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - alchemy-local
    profiles:
      - dev
