# ────────────────────────────────────────────────────────────────────────────
# Alchemy Platform — Production Nginx Configuration
# SSL termination · Rate limiting · Security headers · WebSocket proxy
# ────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;   # Don't expose nginx version

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m    rate=100r/m;
    limit_req_zone $binary_remote_addr zone=signup_zone:5m  rate=3r/h;

    # ── Connection Limits ─────────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ── Upstream FastAPI ──────────────────────────────────────────────────────
    upstream alchemy_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name alchemy.yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name alchemy.yourdomain.com;

        # ── SSL ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/alchemy.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alchemy.yourdomain.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS — only TLS 1.2 and 1.3
        ssl_protocols      TLSv1.2 TLSv1.3;
        ssl_ciphers        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                              always;
        add_header X-Content-Type-Options    "nosniff"                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Connection limits ─────────────────────────────────────────────────
        limit_conn conn_limit_per_ip 20;
        client_max_body_size 10m;
        client_body_timeout 30s;
        client_header_timeout 30s;
        send_timeout 30s;

        # ── Auth endpoints — strict rate limiting ────────────────────────────
        location /api/auth/login {
            limit_req zone=auth_zone burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://alchemy_api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/auth/signup {
            limit_req zone=signup_zone burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://alchemy_api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://alchemy_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Admin endpoints — IP whitelist recommended ────────────────────────
        location /api/admin/ {
            # allow 10.0.0.0/8;   # Uncomment and configure your admin IP range
            # deny all;
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://alchemy_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── WebSocket endpoint ────────────────────────────────────────────────
        location /ws {
            proxy_pass http://alchemy_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── API endpoints ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://alchemy_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ── React SPA — serve static files ───────────────────────────────────
        location / {
            root /var/www/alchemy;
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Don't cache index.html (contains JS bundle hashes)
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
        }

        # ── Deny hidden files ─────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
