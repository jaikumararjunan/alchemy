version: '3.9'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: development
      DATABASE_URL: sqlite+aiosqlite:////data/alchemy.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-AlchemyLocalDev!JWT_Secret_Key_32chars_Min_2024}
      ALCHEMY_VAULT_KEY: ${ALCHEMY_VAULT_KEY:-AlchemyLocalDev!Vault_Key_32chars_Min2024!!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alchemy.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Alchemy#Admin!2024}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - alchemy_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for production rate limiting (optional in dev)
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    profiles: ["production"]

volumes:
  alchemy_data:
