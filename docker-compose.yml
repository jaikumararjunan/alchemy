version: "3.9"

networks:
  alchemy:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:16-alpine
    container_name: alchemy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alchemy
      POSTGRES_USER: alchemy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alchemy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [alchemy]

  redis:
    image: redis:7-alpine
    container_name: alchemy_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [alchemy]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: alchemy_litellm
    restart: unless-stopped
    volumes: [./config/litellm.yaml:/app/config.yaml:ro]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: ["--config","/app/config.yaml","--port","4000"]
    ports: ["127.0.0.1:4000:4000"]
    networks: [alchemy]

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: alchemy_api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-alchemy}:${DB_PASSWORD:-change_me_in_production}@db:5432/alchemy
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-INSECURE_DEV_KEY_CHANGE_IN_PRODUCTION_32_CHARS_MIN}
      ALCHEMY_VAULT_KEY: ${ALCHEMY_VAULT_KEY:-INSECURE_VAULT_KEY_32CHARS_MIN_CHANGE_ME}
      ALCHEMY_FERNET_KEY: ${ALCHEMY_FERNET_KEY:-}
      LITELLM_PROXY_URL: http://litellm:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0
      DELTA_API_KEY: ${DELTA_API_KEY:-}
      DELTA_API_SECRET: ${DELTA_API_SECRET:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ANGEL_API_KEY: ${ANGEL_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alchemy.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME_NOW_2024!}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["~/.alchemy:/root/.alchemy"]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [alchemy]

  nginx:
    image: nginx:1.25-alpine
    container_name: alchemy_nginx
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80","443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./static:/var/www/alchemy:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    profiles: [production]
    networks: [alchemy]
